name: Build Linux / macOS / Legacy Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'platforms-*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build AppImage and deb
        run: |
          node -e "const fs=require('fs');const p='package.json';const d=JSON.parse(fs.readFileSync(p));delete d.build.electronDist;fs.writeFileSync(p,JSON.stringify(d,null,2))"
          npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: platforms-v${{ github.run_number }}
          name: EMCL platform builds
          files: |
            dist/*.AppImage
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build unsigned macOS zip
        run: |
          node -e "const fs=require('fs');const p='package.json';const d=JSON.parse(fs.readFileSync(p));delete d.build.electronDist;fs.writeFileSync(p,JSON.stringify(d,null,2))"
          npx electron-builder --mac zip --${{ matrix.arch }} --publish never
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: platforms-v${{ github.run_number }}
          name: EMCL platform builds
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  legacy-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build legacy 32-bit Windows portable
        run: |
          node -e "const fs=require('fs');const p='package.json';const d=JSON.parse(fs.readFileSync(p));delete d.build.electronDist;d.build.electronVersion='22.3.27';fs.writeFileSync(p,JSON.stringify(d,null,2))"
          npx electron-builder --win portable --ia32 --config electron-builder.legacy.json --publish never
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: platforms-v${{ github.run_number }}
          name: EMCL platform builds
          files: dist-legacy/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
