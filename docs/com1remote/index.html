<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMCL 远程控制</title>
<style>
  :root{--blue:#2F7DF6;--deep:#12345B;--line:#D8E4F2;--muted:#60758C}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(150deg,#EAF3FF,#F8FBFF 45%,#E8F1FF);font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:var(--deep)}
  .card{width:min(520px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 18px 60px rgba(18,52,91,.12)}
  .logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.5px}
  .gem{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2F7DF6,#57A6FF);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
  h1{font-size:24px;margin:22px 0 8px}
  p{font-size:13px;line-height:1.8;color:var(--muted);margin:0 0 14px}
  .btn{display:flex;justify-content:center;align-items:center;width:100%;height:46px;border-radius:10px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800;font-size:14px}
  .btn:hover{filter:brightness(1.06)}
  .note{border:1px solid var(--line);background:#F6FAFF;border-radius:10px;padding:12px;font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}
  .badge{display:inline-block;font-size:11px;font-weight:800;color:#2F7DF6;background:#EAF3FF;border-radius:999px;padding:4px 8px;margin-bottom:4px}
</style>
</head>
<body>
  <main class="card">
    <div class="logo"><span class="gem"></span><span>EMCL <small style="color:var(--muted)">REMOTE</small></span></div>
    <div class="badge">内部远程维护</div>
    <h1>EMCL 远程控制</h1>
    <p>此入口仅用于开发者授权的设备维护。进入后需要 MeshCentral 管理员密码，并会在被控电脑上显示连接提示。</p>
    <a class="btn" href="https://com1.emcl.life" target="_blank" rel="noopener">打开远程桌面</a>
    <div class="note">
      固定入口：<b>com1.emcl.life</b><br>
      当前只开放桌面、文件和电源操作；不提供 Shell / Terminal。<br>
      如果你不是授权维护人员，请关闭此页面。
    </div>
  </main>
</body>
</html>
