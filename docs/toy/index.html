<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8">
<title>Metro Engineer · 地铁规划师</title>
<meta name="description" content="Metro Engineer（地铁规划师）：拖拽站点连成地铁线路，把乘客送到目的地，别让任何一站爆满。EMCL 出品的小游戏。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EMCL">
<meta property="og:title" content="Metro Engineer · 地铁规划师">

<style>
  :root{
    --bg:#F5F1E8;
    --ink:#2A2A2A;
    --ink-soft:#6B6558;
    --panel:rgba(255,255,255,.82);
    --line:#DAD3C4;
    --red:#D7263D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);}
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    user-select:none;
    -webkit-user-select:none;
  }
  #stage{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;top:0;left:0;right:0;
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px 14px;
    pointer-events:none;gap:10px;
  }
  #hud .left{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
  #hud .right{display:flex;align-items:center;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;}
  .stat{
    background:var(--panel);border:1px solid rgba(0,0,0,.06);
    border-radius:10px;padding:3px 9px;font-size:12px;color:var(--ink-soft);
    display:flex;align-items:baseline;gap:4px;backdrop-filter:blur(6px);
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .stat b{font-size:15px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;}
  .bigscore b{font-size:26px;line-height:1;}
  .hbtn{
    pointer-events:auto;border:1px solid rgba(0,0,0,.08);background:var(--panel);
    color:var(--ink);border-radius:10px;font-size:12.5px;font-weight:700;
    padding:6px 11px;cursor:pointer;transition:.12s;backdrop-filter:blur(6px);
    font-family:inherit;
  }
  .hbtn:hover{background:#fff;transform:translateY(-1px);}
  .hbtn:active{transform:translateY(0);}
  .hbtn.off{opacity:.45;cursor:not-allowed;transform:none;}

  /* ---------- 底部线路栏 ---------- */
  #bottom{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
    pointer-events:none;flex-wrap:wrap;
  }
  #slots{display:flex;gap:7px;pointer-events:auto;flex-wrap:wrap;position:relative;}
  .slot{
    width:42px;height:42px;border-radius:12px;background:var(--panel);
    border:1px solid rgba(0,0,0,.07);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.14s;position:relative;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .slot .dot{width:18px;height:18px;border-radius:50%;transition:.14s;}
  .slot .nt{
    position:absolute;bottom:3px;right:4px;font-size:9.5px;font-weight:800;
    color:var(--ink-soft);font-variant-numeric:tabular-nums;
  }
  .slot.locked{opacity:.34;cursor:default;}
  .slot.sel{transform:translateY(-4px);box-shadow:0 6px 14px rgba(0,0,0,.14);border-color:rgba(0,0,0,.16);}
  .slot.sel .dot{transform:scale(1.22);}
  .slot.empty .dot{background:transparent!important;border:2px dashed #C9C1B0;}
  /* 新增路线时从对应槽位上方弹出的小对话框 */
  .newline-pop{
    position:absolute;z-index:30;pointer-events:none;
    padding:5px 11px;border-radius:10px;font-size:12.5px;font-weight:800;white-space:nowrap;
    color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);
    transform:translate(-50%,-100%);opacity:0;
    animation:nlp-in .28s cubic-bezier(.2,.9,.3,1.3) forwards;
  }
  .newline-pop::after{
    content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:inherit;
  }
  /* 淡出：必须用「另一段动画」覆盖 nlp-in —— animation-fill-mode:forwards 的填充值
     优先级高于普通样式声明，若只写 opacity:0;transition，淡出不会生效（气泡会硬消失）。 */
  .newline-pop.out{animation:nlp-out .26s ease forwards;}
  @keyframes nlp-in{
    from{opacity:0;transform:translate(-50%,-86%) scale(.7);}
    to{opacity:1;transform:translate(-50%,-100%) scale(1);}
  }
  @keyframes nlp-out{
    from{opacity:1;transform:translate(-50%,-100%) scale(1);}
    to{opacity:0;transform:translate(-50%,-100%) scale(.88);}
  }
  #actions{display:flex;gap:7px;pointer-events:auto;}

  /* ---------- 覆盖层 ---------- */
  #overlay{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(245,241,232,.82);backdrop-filter:blur(7px);z-index:20;padding:20px;
    /* 点击「开始游戏」后遮罩淡出、露出底下已渲染好的游戏世界 = 画面淡入 */
    opacity:1;transition:opacity .6s ease;
  }
  #overlay.show{display:flex;}
  #overlay.fadeout{opacity:0;}   /* 淡出中：保留 display:flex 直到过渡结束再隐藏 */
  /* 结算态：遮罩不挡视线（要看清镜头推近的爆满站），
     爆满站被安排在屏幕中上方，结算卡停靠屏幕底部 —— 完全不遮挡爆满站 */
  #overlay.reveal{
    background:rgba(245,241,232,.28);backdrop-filter:blur(1.5px);
    align-items:flex-end;justify-content:center;padding:0 20px 5vh;
  }
  #overlay.reveal .card{
    max-width:520px;margin:0 auto;
    border-radius:22px;
    box-shadow:0 24px 70px rgba(0,0,0,.24);
  }
  /* 结算卡分批滑出：标题 → 荣誉(含礼炮) → 数据+按钮 */
  .card .stage{ opacity:0; animation:stageIn .55s cubic-bezier(.16,.84,.3,1) both; }
  .card .st-head { animation-delay:.06s; }
  .card .st-rank { animation-delay:.42s; }
  .card .st-stats{ animation-delay:.82s; }
  @keyframes stageIn{
    from{opacity:0; transform:translateY(30px);}
    to  {opacity:1; transform:translateY(0);}
  }
  .card{
    background:#fff;border-radius:20px;padding:26px 28px;max-width:440px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.16);text-align:center;
    position:relative;            /* 供「疯狂大都市模式」回旋针卡片绝对定位 */
  }
  .card h1{margin:0 0 4px;font-size:30px;font-weight:900;letter-spacing:-.02em;}
  .card h1 span{color:var(--red);}
  .card .sub{margin:0 0 18px;color:var(--ink-soft);font-size:13px;}
  .cta{
    background:var(--ink);color:#fff;border:0;border-radius:12px;
    padding:12px 34px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;
    transition:.14s;letter-spacing:.02em;
  }
  .cta:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18);}
  .cta.alt{background:#EDE8DC;color:var(--ink);margin-left:8px;}
  /* 疯狂大都市模式按钮：灰色底 + 白字，右上角「新!」爆炸形淡红徽标 */
  .cta.crazy{
    position:relative;display:block;background:#878D95;color:#fff;margin:14px auto 0;
    font-size:16px;padding:13px 30px;letter-spacing:.06em;
    box-shadow:0 6px 18px rgba(0,0,0,.18);
  }
  .cta.crazy:hover{background:#767C84;transform:translateY(-2px);}
  .cta.crazy .newbadge{
    position:absolute;top:-13px;right:-13px;width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    background:#F4A59A;color:#B23A2E;font-size:12px;font-weight:900;
    transform:rotate(-14deg);

    box-shadow:0 2px 6px rgba(0,0,0,.22);
  }
  .finalrow{display:flex;justify-content:center;gap:14px;margin:14px 0 20px;}
  .finalrow div{flex:1;}
  .finalrow b{display:block;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;}
  .finalrow small{font-size:11.5px;color:var(--ink-soft);}

  /* ---------- 开始界面：METRO ENGINEER 像素标题 ----------

     每个字母是一个 1 个像素大小的 span，用 box-shadow 把该字母的所有亮格点「印」出来。
     底板用深色，白色 ENGINEER 才看得见（也像地铁站铭牌）。 */

    /* 注意：--px 由 pixelTitle() 内联写入（元素尺寸与阴影步进必须同源），
       这里不要再声明 --px，否则会与 JS 不同步导致像素之间出现缝隙。 */
    display:flex;align-items:flex-start;justify-content:center;
    gap:var(--px);
    background:#141A22;
    border-radius:12px;
    padding:18px 16px;
    margin:0 0 16px;
    box-shadow:inset 0 0 0 2px #2C3A48, inset 0 0 26px rgba(0,0,0,.55), 0 8px 22px rgba(0,0,0,.22);
    /* 兜底：任何情况下都不允许深色面板溢出卡片（溢出就会变成一块难看的黑框） */
    max-width:100%;
    box-sizing:border-box;
  }
  /* 窄屏收紧留白（padX 必须与 JS 的 titlePadX() 保持一致，否则宽度公式会算错） */
  @media(max-width:420px){
    .pixelTitle{padding:14px 10px;}
  }
  /* 两行排版（窄屏）：把词间空隙撑成 100% 宽，ENGINEER 自动落到第二行。
     这样手机上也保住 px=4 的大字母，而不必缩到不可读的 px=2。 */
  .pixelTitle.two{flex-wrap:wrap;row-gap:calc(var(--px)*2);justify-content:center;}
  .pixelTitle.two .pxgap{flex:0 0 100%;width:100%;height:0;}
  /* 关键：box-shadow 复制的是**整个元素盒**，所以画「一个像素」的元素本身必须正好是 px×px。
     但那样 flex 只会按 px 排版 → 字母互相重叠、底部溢出面板。
     所以拆成两层：.pxbox 只负责占位（5×7 字模盒子），.px 负责画像素（px×px）。 */
  .pixelTitle .pxbox{
    width:calc(var(--px)*5);
    height:calc(var(--px)*7);
    position:relative;
    flex:0 0 auto;
  }
  .pixelTitle .px{
    position:absolute;left:0;top:0;
    width:var(--px);height:var(--px);
  }
  .pixelTitle .pxgap{width:calc(var(--px)*4);}
  /* HUD 左上角复用同一套像素标题，只把像素尺寸缩小（由 JS 传 px=3）。
     注意 --px 不要再在这里声明 —— 元素尺寸与阴影步进必须同源，否则像素间会出现缝隙。
     另外 px 不得低于 3：2px 时字母仅 10×14px，点阵的 1px 细笔画会糊成一团。 */
  .pixelTitle.mini{
    padding:8px 10px;border-radius:8px;margin:0;
    box-shadow:inset 0 0 0 1.5px #2C3A48, 0 3px 10px rgba(0,0,0,.18);
  }
  /* HUD 左上角标题改用预渲染位图（内嵌 data URI，保持单文件零外部资源）。
     pixelated = 缩放时用最近邻，避免像素字被插值糊掉；圆角按需求设置。 */
  .brandImg{
    display:block;
    width:190px;height:auto;
    border-radius:8px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    box-shadow:0 3px 10px rgba(0,0,0,.18);

  /* 街机按键风：实心硬投影 + 大写字距；圆角与卡片(20px)/标题面板(12px)协调 */
  .cta.pixel{

    letter-spacing:.08em;
    text-transform:uppercase;
    box-shadow:0 5px 0 #000;

  .cta.pixel:active{transform:translateY(3px);box-shadow:0 2px 0 #000;}

  /* ---------- 开始界面补充信息：本地纪录 / 操作提示 / 回站链接 ---------- */
  .menuMeta{
    margin:15px 0 0;font-size:12.5px;color:var(--ink-soft);

  /* ---------- 暂停提示胶囊（画面上不挡操作，pointer-events:none） ----------
     放在底部中央而不是顶部：暂停瞬间往往同时弹出「乘客返回出发站」的 toast，
     toast 在顶部，两者会叠在一起。底部中央正好是顶栏与底部工具栏之间的空档。 */
  #pauseChip{
    position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));

  /* ---------- 结算卡：纪录行 ---------- */
  .bestrow{

  /* ---------- 提示条 ---------- */
  #toast{

  /* ---------- 通用隐藏 ---------- */

  /* ---------- 结算：荣誉称号配色（铜 / 银 / 金 / 金闪） ---------- */

  /* 金闪：流光金色渐变 */

  .ctarow{display:flex;justify-content:center;gap:10px;margin-top:4px;flex-wrap:wrap;}

  /* ---------- 结算：疯狂大都市模式的「回旋针 + 卡片」侧边装饰 ---------- */
  .crazytag{

  /* ---------- 铁路系统总览模式 ---------- */
  body.ov #hud, body.ov #bottom, body.ov #zoomctl{ display:none; }
  #ovbar{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:18;

    transition:transform .28s cubic-bezier(.2,.7,.2,1), opacity .28s cubic-bezier(.2,.7,.2,1);

  /* 总览模式下点空白：数据栏滑出视野（便于整体布局截图） */

  #infoPanel .ip-head{font-size:15px;font-weight:900;margin-bottom:4px;}
  #infoPanel .ip-sum{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  #infoPanel .ip-sum b{color:var(--ink);font-weight:800;}
  #infoPanel .ip-hint{font-size:12.5px;line-height:1.6;color:var(--ink-soft);}
  #infoPanel .ip-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;margin-bottom:2px;}
  #infoPanel .ip-dot{width:14px;height:14px;border-radius:50%;background:var(--ink);display:inline-block;}
  #infoPanel .ip-sub{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
  #infoPanel .ip-metric{display:flex;justify-content:space-between;align-items:baseline;
    padding:7px 0;border-top:1px solid rgba(0,0,0,.06);}
  #infoPanel .ip-metric:first-of-type{border-top:0;}
  #infoPanel .ip-metric span{color:var(--ink-soft);}
  #infoPanel .ip-metric b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;}
  /* 切换选中站点/线路时，数据栏淡入 + 轻微横移 */
  #infoPanel.swap{ animation: ipSwap .30s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes ipSwap{
    from{ opacity:0; transform:translateX(16px); }
    to  { opacity:1; transform:translateX(0); }
  }
  /* 热力图开关按钮：按下回弹动效 + 开启态高亮 */
  #ovHeat.pop{ animation: btnPop .28s ease; }
  @keyframes btnPop{
    0%{ transform:scale(1); } 45%{ transform:scale(.92); } 100%{ transform:scale(1); }
  }
  #ovHeat.on{
    background:linear-gradient(180deg,#ff7a59,#ef4444);
    color:#fff;border-color:rgba(239,68,68,.5);
    box-shadow:0 4px 14px rgba(239,68,68,.35);
  }
  /* 顶层特效画布：彩带礼炮，盖在结算卡之上 */
  #fx{position:fixed;inset:0;z-index:25;pointer-events:none;}
  /* 过场幕布：进入/返回铁路系统总览时擦过屏幕（z 高于结算卡，低于礼炮） */
  #ovtrans{
    position:fixed;inset:0;z-index:22;pointer-events:none;
    background:linear-gradient(115deg,#F4EFE6 0%,#ECE4D2 52%,#F4EFE6 100%);
    transform:translateX(120%);will-change:transform;
  }
  #ovtrans.go{ animation:ovReveal .52s cubic-bezier(.76,0,.24,1) both; }
  @keyframes ovReveal{
    0%  { transform:translateX(0); }       /* 立即满屏覆盖，挡住场景切换的瞬间 */
    100%{ transform:translateX(-120%); }   /* 向左擦出，露出新场景 */
  }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

</div>

<div id="toast"></div>
<!-- 暂停提示：只在暂停时淡入；pointer-events:none，不拦暂停状态下的改线操作 -->

  <button class="zbtn" id="zIn" title="放大">＋</button>
  <div id="zLabel">100%</div>

  <button class="zbtn" id="zOut" title="缩小">－</button>

  <div class="card" id="card"></div>
</div>
<!-- 过场幕布：进入 / 返回铁路系统总览时的擦屏动画 -->

  <div class="ov-title">铁路系统总览</div>

</div>

<!-- 顶层特效画布（彩带礼炮），盖在结算卡之上，独立一层、不参与世界变换 -->
<canvas id="fx"></canvas>

<script>
(function(){
"use strict";

/* =========================================================
   0. 基础工具
   ========================================================= */
const rand  = (a,b)=> a + Math.random()*(b-a);
const pick  = a => a[(Math.random()*a.length)|0];
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a + (b-a)*t;
const dist  = (ax,ay,bx,by)=> Math.hypot(ax-bx, ay-by);
const TAU = Math.PI*2;
// back-out：末端轻微过冲后回落，给「弹出/跳跃」的手感（峰值约 +10%）
function backOut(t){ const c1=1.70158, c3=c1+1, u=t-1; return 1 + c3*u*u*u + c1*u*u; }

/* =========================================================
   1. 配置
   ========================================================= */
const CFG = {
  stationR      : 13,     // 站点半径
  lineW         : 7,      // 线路粗细
  trainCap      : 8,      // 单列车载客量（任何图形乘客皆可载）
  stationCap    : 8,      // 站点排队达到此值即「满」，开始读秒
  trainSpeed    : 118,    // px / 秒
  dwell         : 0.5,    // 停站时间
  overcrowdSec  : 35,     // 拥挤爆表时限（读秒时长，归零即失败）
  maxLines      : 12,
  startLines    : 3,
  // 注意：站点**没有数量上限**（原 maxStations 已移除）。
  // spawnStation 找不到满足「不压河 + 不贴脸」的点时会返回 null，那一轮就不生成 —— 这是安全的。
  startStations : 4,
  hitStation    : 27,
  hitLine       : 11,
  tunnelCapStart: 3,       // 开局隧道容量（最多同时存在的隧道段数）
  tunnelCapStep : 40,      // 每过这么多秒，隧道容量 +1
  tunnelCapMax  : 16,      // 隧道容量上限
  // —— 机场 ——
  airportCap    : 16,      // 机场站排队上限（普通站是 stationCap=8）
  planeLoad     : 8,       // 每架飞机抵达时给机场带来的乘客数
  planeFirst    : 12,      // 开局第一架飞机的延迟（秒）
  planeGapMin   : 16, planeGapMax : 26,   // 后续飞机间隔（秒）
  airportGapMin : 55, airportGapMax: 80,  // 每隔多久新增一座机场（秒）
  maxAirports   : 4,       // 机场总数上限
  planeFlySec   : 3.6,     // 飞机单程（画面外↔机场）飞行时长（秒）—— 要慢，看得清
  planeDwellSec : 0.55,    // 落地卸客的停留时长（秒），卸完再飞走
};

// 列车缓入缓出：靠近/刚离开车站时减速，区间中部全速
// 列车加减速：出站加速 EASE_ACC、进站减速 EASE_DEC（减速距离比加速长 → 刹车更明显），
// 速度下限 EASE_MIN —— 到站前平滑滑行、缓缓停下。
// 参数都是量化扫出来的，取值经过**三轮**用户反馈调整（每轮都实测「末18px均速 / 100px→到站耗时」）：
//   ① DEC=84 / MIN=0.13 太滑，最后 100px 要爬 2.52s → 用户报「入站太慢」；
//   ② DEC=60 / MIN=0.22（1.62s / 末速 26）→ 用户报「再快一点」；
//   ③ DEC=46 / MIN=0.34（1.25s / 末速 40）→ 用户报「再快一点」；
//   ④ 现值 DEC=40 / MIN=0.45：**1.10s、末段均速 53px/s（比③快 32%）**，
//      且 53/118 = 45% 巡航速度 —— 刹车依然清晰可见，
//      不会退回「满速冲进站再硬停」。别再往上加 MIN，否则看起来像没有减速。
const EASE_ACC = 34, EASE_DEC = 40, EASE_MIN = 0.45;
function smoothstep(x){ x = clamp(x,0,1); return x*x*(3-2*x); }

  DPR = Math.min(window.devicePixelRatio||1, 2);

/* 飞机轮廓（机头朝 -y 方向的归一化顶点，乘以 r 后绕 (x,y) 旋转 ang）。
   机场站用它当标志；飞行动画也复用它，只是尺寸更大、并按航向旋转。 */
const PLANE_PTS = [
  [0,-0.95],[0.18,-0.50],[0.18,-0.15],[0.80,0.25],[0.80,0.42],[0.17,0.24],
  [0.15,0.70],[0.52,0.88],[0.52,0.95],[0,0.72],[-0.52,0.95],[-0.52,0.88],
  [-0.15,0.70],[-0.17,0.24],[-0.80,0.42],[-0.80,0.25],[-0.18,-0.15],[-0.18,-0.50]
];
function planePath(c, x, y, r, ang){
  const ca = Math.cos(ang||0), sa = Math.sin(ang||0);
  c.beginPath();
  for (let i=0;i<PLANE_PTS.length;i++){
    const px = PLANE_PTS[i][0]*r, py = PLANE_PTS[i][1]*r;
    const rx = x + px*ca - py*sa, ry = y + px*sa + py*ca;
    i ? c.lineTo(rx,ry) : c.moveTo(rx,ry);
  }
  c.closePath();
}

function shapePath(c, shape, x, y, r, rot){
  rot = rot||0;
  c.beginPath();
  if (shape==='airport'){ planePath(c, x, y, r*1.02, rot); return; }
  if (shape==='circle'){ c.arc(x,y,r,0,TAU); return; }
  if (shape==='square'){
    const s = r*0.86;
    c.rect(x-s, y-s, s*2, s*2);
    return;
  }
  if (shape==='star'){
    for (let i=0;i<10;i++){
      const rr = (i%2) ? r*0.44 : r*1.02;
      const a = -Math.PI/2 + i*Math.PI/5;
      const px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr;
      i ? c.lineTo(px,py) : c.moveTo(px,py);
    }
    c.closePath(); return;
  }
  const n = shape==='triangle' ? 3 : shape==='diamond' ? 4 : 5;
  for (let i=0;i<n;i++){
    const a = -Math.PI/2 + rot + i*TAU/n;
    const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
    i ? c.lineTo(px,py) : c.moveTo(px,py);
  }
  c.closePath();
}
// diamond 用「顶点朝上」的正菱形，square 用正交正方形，两者必须能一眼区分
function shapeRot(shape){ return 0; }

const Snd = {
  ac:null, muted:false,
  init(){
    if (this.ac) { if (this.ac.state==='suspended') this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  },
  tone(f,dur,type,vol){
    if (!this.ac || this.muted) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol||0.05,t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.ac.destination);
    o.start(t); o.stop(t+dur+0.03);
  },
  board(){ this.tone(660,0.07,'triangle',0.035); },
  deliver(){ this.tone(990,0.09,'triangle',0.05); this.tone(1320,0.07,'sine',0.03); },
  warn(){ this.tone(180,0.22,'square',0.045); },
  over(){ this.tone(150,0.5,'sawtooth',0.09); this.tone(100,0.8,'sine',0.07); },
  newline(){ this.tone(520,0.1,'sine',0.05); this.tone(780,0.12,'sine',0.045); },
  // 新站点落成：短促的上行两音（G4→D5），配合出场的轻微跳跃
  station(){ this.tone(392,0.06,'sine',0.04); this.tone(587,0.09,'sine',0.03); },
  // 飞机抵达机场：下行两音（F#5→C#5），像客机降落时的提示音
  plane(){ this.tone(740,0.13,'sine',0.042); this.tone(554,0.18,'sine',0.034); },
  // 站点接入线路：16 音五声音阶逐级上行（C5→C8，跨 3 个八度），
  // 一次拖拽连多个站时就是一串清脆的上行音；叠一层八度泛音让音色更「灵动」。
  connect(step){
    const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51,
                   1567.98, 1760.00, 2093.00, 2349.32, 2637.02, 3135.96, 3520.00, 4186.01];
    const f = scale[clamp(step|0, 0, scale.length-1)];
    this.tone(f,   0.09, 'triangle', 0.05);
    this.tone(f*2, 0.05, 'sine',     0.022);
  }
};

/* =========================================================
   4b. 背景音乐（BGM）：仅「疯狂大都市模式」播放
   - 用 HTMLAudioElement 直接 loop，省去手写 WebAudio 调度；
   - 自动播放策略要求用户手势后才能响 —— 开始按钮的 click 刚好是手势，所以 startGame 里 startBGM() 合法；
   - 无头回归环境没有 Audio 构造器，必须 typeof 守卫，否则 new Audio 抛 ReferenceError。
   ========================================================= */
const BGM_SRC = 'concretebgm.mp3';
let bgmEl = null, bgmMuted = false;
function startBGM(){
  if (typeof Audio === 'undefined') return;
  try {
    if (!bgmEl){ bgmEl = new Audio(BGM_SRC); bgmEl.loop = true; bgmEl.volume = 0.45; }
    bgmEl.muted = bgmMuted;
    const p = bgmEl.play();
    if (p && p.catch) p.catch(()=>{});   // 自动播放被拦截时静默失败，不阻塞游戏
  } catch(e){}
  const b = el('bgmBtn'); if (b) b.textContent = bgmMuted ? '🔇 BGM' : '🎵 BGM';
}
function stopBGM(){ if (bgmEl){ try { bgmEl.pause(); } catch(e){} } }

/* =========================================================
   4b. 本地存档：最高纪录 + 偏好（静音 / 新手提示只看一次）
   网页版刷新就重来，留个纪录是必要的。全部读写都 try 守卫 ——
   file:// 或隐私模式下 localStorage 会直接抛异常，不能让它拖垮游戏。
   ========================================================= */
const SAVE_KEY = 'metroEngineer.v1';
const Save = {
  best: { normal: 0, crazy: 0 },
  muted: false,
  bgmMuted: false,
  seenIntro: false,
  load(){
    try{
      if (typeof localStorage === 'undefined') return;
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return;
      if (d.best && typeof d.best === 'object'){
        this.best.normal = Math.max(0, Math.floor(+d.best.normal) || 0);
        this.best.crazy  = Math.max(0, Math.floor(+d.best.crazy)  || 0);
      }
      this.muted     = !!d.muted;
      this.bgmMuted  = !!d.bgmMuted;
      this.seenIntro = !!d.seenIntro;
    }catch(e){}
  },
  save(){
    try{
      if (typeof localStorage === 'undefined') return;
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        best: this.best, muted: this.muted, bgmMuted: this.bgmMuted, seenIntro: this.seenIntro
      }));
    }catch(e){}
  },
  bestOf(crazy){ return crazy ? this.best.crazy : this.best.normal; },
  // 只有真的更高才写盘；返回是否破纪录
  record(crazy, score){
    const k = crazy ? 'crazy' : 'normal';
    if (score > this.best[k]){ this.best[k] = score; this.save(); return true; }
    return false;
  }
};
Save.load();
// 把存档里的偏好套回运行时
Snd.muted = Save.muted;
bgmMuted  = Save.bgmMuted;

function makeStation(shape,x,y){

    ring:0,               // 接入线路时的扩散涟漪（1→0，纯视觉）

    // transfer=本站换乘量, boarded=本站上车数, peak=峰值排队, wait*=平均等待
    stats:{ spawn:0, delivered:0, transfer:0, boarded:0, peak:0, waitSum:0, waitCount:0 } };
