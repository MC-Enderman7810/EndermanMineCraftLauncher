/* =========================================================
   11b. 结算：荣誉称号 + 铁路系统总览模式 + 热力图 + 彩带礼炮
   ========================================================= */
// 按总送达人数映射荣誉称号与配色档位（铜 / 银 / 金 / 金闪）
function getRank(d){
  if (d>2600) return { name:'城市动脉传奇设计师', tier:'goldflash' };
  if (d>1200) return { name:'地铁运营总指挥',     tier:'gold' };
  if (d>800)  return { name:'线路设计主管',       tier:'gold' };
  if (d>500)  return { name:'地铁架构师',         tier:'gold' };
  if (d>300)  return { name:'枢纽主管',           tier:'gold' };
  if (d>100)  return { name:'调度专员',           tier:'gold' };
  if (d>50)   return { name:'线路助理',           tier:'bronze' };
  return { name:'实习站务员', tier:'bronze' };
}

// —— 过场幕布：擦屏盖住场景切换的瞬间（z 高于结算卡）——
function playTrans(){
  const t = el('ovtrans'); if (!t) return;
  t.classList.remove('go');
  void t.offsetWidth;        // 强制回流，确保动画每次都能重启
  t.classList.add('go');
}
// —— 铁路系统总览模式：游戏结束后进入，看全局网络、点线路/站点看详情、开热力图 ——
function enterOverview(){
  if (G.mode!=='over' && G.mode!=='overview') return;
  playTrans();                 // 过场：幕布擦入再擦出，露出总览
  G.mode='overview';
  if (document.body) document.body.classList.add('ov');
  el('overlay').classList.remove('show','reveal','fadeout');
  el('ovbar').classList.remove('hidden');
  el('infoPanel').classList.remove('hidden','gone');
  G.selEntity = null;
  confetti = [];                       // 清掉结算残留的礼炮粒子
  if (fctx) fctx.clearRect(0,0,W,H);
  fitNetworkView();
  renderInfo();
}
function exitOverview(){
  playTrans();                 // 过场：幕布擦入再擦出，露出结算卡
  G.mode='over';
  G.heatmap=false; heatmapAlpha=0;   // 离开总览时收掉热力图，下次进入是干净状态
  const _oh=el('ovHeat'); if (_oh){ _oh.textContent='热力图：关'; _oh.classList.remove('on'); }
  if (document.body) document.body.classList.remove('ov');
  el('ovbar').classList.add('hidden');
  el('infoPanel').classList.add('hidden');
  el('infoPanel').classList.remove('gone');
  el('overlay').classList.add('show','reveal');
}
function toggleHeat(){ G.heatmap = !G.heatmap; renderInfo(false); }
// 相机适配全部站点：居中并缩放到能容纳整张网
function fitNetworkView(){
  if (!G.stations.length){ cam.x=W/2; cam.y=H/2; cam.scale=1; camTween=null; return; }
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for (const st of G.stations){
    minx=Math.min(minx,st.x); miny=Math.min(miny,st.y);
    maxx=Math.max(maxx,st.x); maxy=Math.max(maxy,st.y);
  }
  const pad=130;
  const bw=(maxx-minx)+pad*2, bh=(maxy-miny)+pad*2;
  const s=Math.min(W/bw, H/bh, CAM_MAX);
  const cx=(minx+maxx)/2, cy=(miny+maxy)/2;
  cam.scale = clamp(s, CAM_MIN, CAM_MAX);
  cam.x = W/2 - cx*cam.scale;
  cam.y = H/2 - cy*cam.scale;
  camTween = null;
}
// 线路聚合指标（换乘量 / 平均等待 / 平均拥堵）
function lineMetrics(L){
  let waitSum=0, waitCount=0, peakSum=0, n=0;
  for (const st of L.stations){
    waitSum+=st.stats.waitSum; waitCount+=st.stats.waitCount; peakSum+=st.stats.peak; n++;
  }
  return {
    rides:L.stats.rides, transfer:L.stats.transfer,
    avgWait: waitCount? waitSum/waitCount : 0,
    avgPeak: n? peakSum/n : 0
  };
}
function fmtWait(sec){ return (sec>0? sec.toFixed(1):'0.0')+'s'; }
function metricRow(k,v){
  return '<div class="ip-metric"><span>'+k+'</span><b>'+v+'</b></div>';
}
function shapeName(s){
  return ({circle:'圆形',triangle:'三角',square:'方形',diamond:'菱形',star:'星形',airport:'机场'})[s]||s;
}
// 总览模式选中站点/线路：若数据栏已滑走则滑回（不重播内容动效）；已显示则重播切换动效
function selectEntityInOverview(ent){
  G.selEntity = ent;
  const ip = el('infoPanel');
  if (ip.classList.contains('gone')){ ip.classList.remove('gone'); renderInfo(false); }
  else renderInfo(true);
}
// 详情面板：网络总览 + 选中线路/站点的四项指标
function renderInfo(animate){
  const ip = el('infoPanel');
  let h = '<div class="ip-head">铁路系统总览</div>';
  h += '<div class="ip-sum">总送达 <b>'+G.delivered+'</b> · 线路 <b>'+G.lines.length+'</b> · 站点 <b>'+G.stations.length+'</b></div>';
  if (!G.selEntity){
    h += '<div class="ip-hint">点击线路或站点查看详情：<br>客流量 · 换乘量 · 拥堵度 · 平均等待时间<br><br>右上角可开启「客流压力热力图」。</div>';
    ip.innerHTML = h; return;
  }
  if (G.selEntity.type==='station'){
    const st = G.selEntity.ref;
    const flow = st.stats.spawn + st.stats.transfer + st.stats.delivered;
    const cap = stationCapOf(st);                       // 机场 16 / 普通 8
    const peakPct = Math.round(st.stats.peak / cap * 100);
    h += '<div class="ip-title"><span class="ip-dot"></span>'+shapeName(st.shape)+'站</div>';
    h += metricRow('客流量', flow+' 人');
    h += metricRow('换乘量', st.stats.transfer+' 人');
    h += metricRow('拥堵度', '峰值 '+st.stats.peak+'/'+cap+'（'+peakPct+'%）');
    h += metricRow('平均等待时间', fmtWait(st.stats.waitCount? st.stats.waitSum/st.stats.waitCount : 0));
  } else {
    const L = G.selEntity.ref;
    const mt = lineMetrics(L);
    const peakPct = Math.round(mt.avgPeak / CFG.stationCap * 100);
    h += '<div class="ip-title"><span class="ip-dot" style="background:'+L.color+'"></span>'+L.name+'</div>';
    h += '<div class="ip-sub">'+L.stations.length+' 个站点</div>';
    h += metricRow('客流量', mt.rides+' 人');
    h += metricRow('换乘量', mt.transfer+' 人');
    h += metricRow('拥堵度', '平均峰值 '+mt.avgPeak.toFixed(1)+'/'+CFG.stationCap+'（'+peakPct+'%）');
    h += metricRow('平均等待时间', fmtWait(mt.avgWait));
  }
  ip.innerHTML = h;
  // 切换选中对象时让数据栏做一次淡入+轻微横移，强调「换了一张数据」
  if (animate){
    ip.classList.remove('swap'); void ip.offsetWidth; ip.classList.add('swap');
  }
}
// 热力图：以站点峰值排队为压力，径向渐变叠加（蓝→青→绿→黄→红，additive）
function drawHeatmap(){
  if (heatmapAlpha<=0) return;
  let maxPeak=0;
  for (const st of G.stations) maxPeak=Math.max(maxPeak, st.stats.peak);
  if (maxPeak<=0) return;
  ctx.save();
  // 用普通 alpha 叠加（而非 additive）：在浅色底图上 additive 会迅速饱和成白色，
  // 蓝端几乎看不出颜色；普通叠加能让蓝→红的色相清晰可辨。
  ctx.globalAlpha = heatmapAlpha;
  for (const st of G.stations){
    const t = clamp(st.stats.peak/maxPeak, 0, 1);
    if (t<=0) continue;
    const R = 30 + 90*t;
    const g = ctx.createRadialGradient(st.x,st.y,0, st.x,st.y,R);
    const hue = 240*(1-t);            // 蓝(240)→青→绿→黄→红(0)，压力越高越红
    g.addColorStop(0, 'hsla('+hue+',92%,52%,'+(0.60*t+0.22)+')');
    g.addColorStop(0.6, 'hsla('+hue+',92%,52%,'+(0.26*t+0.10)+')');
    g.addColorStop(1, 'hsla('+hue+',92%,52%,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(st.x,st.y,R,0,TAU); ctx.fill();
  }
  ctx.restore();
}

// —— 彩带礼炮（结算庆祝）——
let confetti = [];
function spawnConfetti(tier){
  confetti = [];
  const golden = (tier==='gold' || tier==='goldflash');
  const colors = golden
    ? ['#FFD700','#FFC107','#FFE082','#FFF8E1','#E0A531']
    : ['#FF5A5F','#5AC8FA','#FFD166','#06D6A0','#B388FF','#FF8C42'];
  if (tier==='goldflash') colors.push('#FFFBE0');
  const corners = [[46,H-16],[W-46,H-16]];
  const N = golden? 170 : 140;
  for (let c=0;c<2;c++){
    const ox=corners[c][0], oy=corners[c][1];
    const dir = c===0 ? 1 : -1;        // 左炮向右上、右炮向左上
    for (let i=0;i<N/2;i++){
      const base = -Math.PI/2 + dir*rand(0.15,0.85);
      const sp = rand(380,760);
      confetti.push({ x:ox, y:oy, vx:Math.cos(base)*sp, vy:Math.sin(base)*sp,
        rot:rand(0,TAU), vr:rand(-9,9), w:rand(5,12), h:rand(9,20),
        color:pick(colors), life:0, max:rand(2.2,3.8) });
    }
  }
}
function updateConfetti(dt){
  for (let i=confetti.length-1;i>=0;i--){
    const p=confetti[i];
    p.life+=dt; p.vy += 540*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
    if (p.life>=p.max || p.y>H+50) confetti.splice(i,1);
  }
}
function drawConfetti(){
  if (!confetti.length || !fctx) return;
  fctx.clearRect(0,0,W,H);
  fctx.save();
  for (const p of confetti){
    const a = clamp(1 - p.life/p.max, 0, 1);
    fctx.globalAlpha = a;
    fctx.save();
    fctx.translate(p.x,p.y); fctx.rotate(p.rot);
    fctx.fillStyle = p.color;
    fctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    fctx.restore();
  }
  fctx.restore();
}

// 镜头平滑推近到指定站点（爆满时聚焦该站；否则回到默认视角）
function focusOnStation(st){
  clearTimeout(focusTimer);
  if (!st){ camTween = null; return; }
  const targetScale = 2.1;
  const focusY = H * 0.30;          // 爆满站停在屏幕中上方，给底部结算卡让出空间
  camTween = {
    t:0, dur:0.85,
    x0:cam.x, y0:cam.y, s0:cam.scale,
    x1:W/2 - st.x*targetScale, y1:focusY - st.y*targetScale,
    s1:targetScale,
  };
}
let focusTimer = null;

/* ---- 开始界面的点阵标题：METRO ENGINEER ----
   5×7 点阵字库（1=亮格）。不引外部字体，用 box-shadow 把每个亮格「印」成一个像素方块，
   这样在任何浏览器/离线环境下都是真正的像素风，而不是靠字体碰运气。 */
const PIXFONT = {
  M:['10001','11011','10101','10101','10001','10001','10001'],
  E:['11111','10000','10000','11110','10000','10000','11111'],
  T:['11111','00100','00100','00100','00100','00100','00100'],
  R:['11110','10001','10001','11110','10100','10010','10001'],
  O:['01110','10001','10001','10001','10001','10001','01110'],
  N:['10001','11001','10101','10011','10001','10001','10001'],
  G:['01110','10001','10000','10111','10001','10001','01111'],
  I:['11111','00100','00100','00100','00100','00100','11111'],
};
// METRO 五个字母各用一种颜色（像地铁线路图），ENGINEER 统一白色
const METRO_COLORS = { M:'#E8453C', E:'#F5A623', T:'#2ECC71', R:'#3DA5F4', O:'#B06BE8' };
/* S = 一个像素的边长。
   血泪：S（阴影步进）与元素实际尺寸必须**严格相等**，否则相邻像素之间会出现 1px 缝隙，
   整行字看起来像「串珠/虚线」而不是实心像素块。
   （曾把 HUD 的 --px 改成 3px 却忘了同步 S=4 → HUD 标题变成点状，截图才看出来。）
   所以这里让 JS 同时决定「元素尺寸」和「步进」：把 --px 内联写进 style，
   从结构上杜绝 CSS 与 JS 不同步。 */
function pixelLetter(ch, color, S){
  const g = PIXFONT[ch];
  if (!g) return '';
  const out = [];
  for (let r=0;r<g.length;r++)
    for (let c=0;c<g[r].length;c++)
      if (g[r][c]==='1') out.push((c*S)+'px '+(r*S)+'px 0 0 '+color);
  // .pxbox 占位 5×7 字模盒，.px 自身只有 1 个像素大（box-shadow 复制的是元素盒）
  return '<span class="pxbox"><i class="px" style="box-shadow:'+out.join(',')+'"></i></span>';
}
// px = 像素边长（同时写进 --px 和阴影步进）；extraClass 可传 'mini' 等修饰类
function pixelTitle(px, extraClass){
  const S = px || 4;
  let h = '<div class="pixelTitle'+(extraClass?' '+extraClass:'')+'" style="--px:'+S+'px">';
  for (const ch of 'METRO') h += pixelLetter(ch, METRO_COLORS[ch]||'#fff', S);
  h += '<span class="pxgap"></span>';
  for (const ch of 'ENGINEER') h += pixelLetter(ch, '#FFFFFF', S);
  return h + '</div>';
}

/* 开始界面标题面板的宽度公式（px = 像素边长）。
   一行排版：14 个 flex 子项（13 字母 + 1 词间空隙）→ **13 个 gap**，
     13 字母 × 5 格 = 65·px，gap 13·px，词间空隙 4·px  => 内容 82·px，加左右 padding。
   两行排版（窄屏）：把词间空隙改成 100% 宽，把 ENGINEER 挤到第二行，
     最长的一行是 ENGINEER = 8 字母 × 5 格 + 7 个 gap = 47·px，加左右 padding。
   **padX 必须与 CSS 里那条 @media(max-width:420px) 的 padding 一致**，
   否则公式会在临界宽度上算错、标题差几个像素塞不下。
   为什么不用 transform:scale 把标题缩小：缩放会把 box-shadow 画出的像素插值糊掉，
   pixel 风就毁了；而且 px 降到 2 以下字母只有 10×14px，1px 细笔画会糊成一团（实测不可读）。
   所以宁可**换行**也不缩放 —— 两行时仍能用 px=4 的大字母。 */
function titlePadX(){ return W<=420 ? 10 : 16; }
function titleWidth(px){ return 82*px + 2*titlePadX(); }        // 一行
function titleWidthTwo(px){ return 47*px + 2*titlePadX(); }     // 两行

/* 按当前卡片可用宽度挑一个不溢出的排版：从 px=4 往下试，
   每个 px 优先「一行」，一行放不下再试「两行」，都不行才降 px。
   渲染后再量一次真实宽度兜底：万一仍超出（极端窄屏），用 scale 压回去，
   保证标题**永远不会溢出卡片/屏幕**（那会出现一块难看的黑色边框）。 */
function fitPixelTitle(){
  const host = el('titleHost');
  if (!host) return;
  const cardW = el('card').clientWidth || (W - 40);      // 减去 #overlay 的左右 padding
  const avail = Math.max(60, cardW - 56);                // 减去 .card 左右 padding 28×2
  let px = 0, two = false;
  for (let p=4; p>=1; p--){
    if (titleWidth(p) <= avail){ px = p; two = false; break; }
    if (titleWidthTwo(p) <= avail){ px = p; two = true;  break; }
  }
  if (!px){ px = 1; two = true; }
  host.innerHTML = pixelTitle(px, two ? 'two' : '');
  const t = host.firstElementChild;
  if (t && t.getBoundingClientRect){
    const w = t.getBoundingClientRect().width;
    if (w > avail) t.style.transform = 'scale(' + (avail/w).toFixed(4) + ')';
  }
}

  stopBGM();                                  // 回到开始界面不再播 BGM

/* 遮罩淡出：保留 display:flex 让 opacity 过渡能播放，过渡结束（或兜底超时）后
   才真正隐藏，避免「硬切」。期间若又被 menu/gameOver 重新显示（show 重新加上），
   则不隐藏，让新的菜单/结算正常出现。 */
function fadeOutOverlay(){
  const ov = el('overlay');
  if (!ov.classList.contains('show')){ ov.classList.remove('show','reveal','fadeout'); return; }
  ov.classList.add('fadeout');
  let done = false;
  const finish = () => {
    if (done) return; done = true;
    ov.removeEventListener('transitionend', onEnd);
    if (ov.classList.contains('fadeout')) ov.classList.remove('show','reveal','fadeout');
  };
  const onEnd = (e) => { if (e.propertyName==='opacity') finish(); };
  ov.addEventListener('transitionend', onEnd);
  setTimeout(finish, 760);   // 兜底：reduced-motion 等不触发过渡时强制收尾
}

/* =========================================================
   12. 主循环
   ========================================================= */
let last = performance.now();
function loop(now){
  const raw = Math.min((now-last)/1000, 0.05);
  last = now;

  // 结束镜头缓动（与游戏逻辑无关，over 状态也要跑）
  if (camTween){
    camTween.t += raw;
    const k = clamp(camTween.t / camTween.dur, 0, 1);
    const e = k<0.5 ? 4*k*k*k : 1 - Math.pow(-2*k+2,3)/2;   // easeInOutCubic
    cam.x = lerp(camTween.x0, camTween.x1, e);
    cam.y = lerp(camTween.y0, camTween.y1, e);
    cam.scale = lerp(camTween.s0, camTween.s1, e);
    if (k>=1) camTween = null;
  }

  // 河流入场延伸（纯视觉，与游戏逻辑无关；用真实时间推进，暂停/结束也要跑完）
  if (riverIn < 1) riverIn = Math.min(1, riverIn + raw/RIVER_IN_SEC);

  // 热力图开关淡入淡出（纯视觉）
  const hTarget = (G.mode==='overview' && G.heatmap) ? 1 : 0;
  heatmapAlpha += (hTarget - heatmapAlpha) * Math.min(1, raw*6);
  if (heatmapAlpha < 0.01) heatmapAlpha = 0;

  // 站点「接入线路」涟漪：纯视觉。必须放在 play 分支之外 —— 暂停时仍可拖拽改线，
  // 若只在 updateStations 里衰减，暂停中接入的站会把涟漪永久卡住。
  for (const st of G.stations){ if (st.ring>0) st.ring = Math.max(0, st.ring - raw*2.4); }

  // 结算彩带礼炮在 over 态持续更新（与游戏逻辑无关）
  if (G.mode==='over' && confetti.length) updateConfetti(raw);

  if (G.mode==='play' && !G.paused){
    const dt = raw * G.speed;
    G.elapsed += dt;
    G.tunnelCap = Math.min(CFG.tunnelCapMax, CFG.tunnelCapStart + Math.floor(G.elapsed/CFG.tunnelCapStep));
    updateSpawn(dt);
    updateTrains(dt);
    updateAnims(dt);
    updateStations(dt);
    updatePlanes(dt);      // 飞机飞行推进（落地后给机场加乘客）
    updateHUD();
  }
  render();
  requestAnimationFrame(loop);
}

function updateHUD(){
  el('uDeliver').textContent = G.delivered;
  // 隧道数 = 跨越河流的「线路」条数（受隧道容量上限约束，复用缓存避免每帧重算求交）。
  // 按线路计，而非按被切出的 tunnel 片段计，避免一条线多次穿河导致计数虚高。
  let tunnelLines = 0;
  for (const L of G.lines){
    if (!L.path || L.path.length<2) continue;
    for (const p of lineRiverPieces(L)){ if (p.tunnel){ tunnelLines++; break; } }
  }
  const cap = G.tunnelCap || CFG.tunnelCapStart;
  const eff = Math.min(tunnelLines, cap);
  el('uTunnels').textContent = eff + '/' + cap;
  const m = Math.floor(G.elapsed/60), s = Math.floor(G.elapsed%60);
  el('uClock').textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  el('uDay').textContent = Math.floor(G.elapsed/45)+1;
}
