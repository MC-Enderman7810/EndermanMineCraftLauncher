<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMCL · Enderman MineCraft Launcher</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="minimal.css" />
  <link rel="stylesheet" href="workspaces.css" />
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-brand">
      <img class="brand-icon" src="../../assets/icon.png" alt="" />
      <span>EMCL</span>
      <span class="edition-label" id="editionLabel" hidden>DEV</span>
    </div>
    <div class="titlebar-drag"></div>
    <div class="window-buttons">
      <button id="winMin" class="win-btn" title="最小化" aria-label="最小化"></button>
      <button id="winMax" class="win-btn" title="最大化" aria-label="最大化"></button>
      <button id="winClose" class="win-btn win-close" title="关闭" aria-label="关闭"></button>
    </div>
  </div>

  <div class="app-shell">
    <aside class="sidebar">
      <nav id="nav" class="nav" aria-label="主导航"></nav>
      <div class="sidebar-bottom">
        <nav id="utilityNav" class="nav" aria-label="工具"></nav>
        <button class="account-mini nav-item" id="accountMini" title="账户" aria-label="账户"></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="pageTitle">主页</h1>
        </div>
        <div class="topbar-right">
          <button class="workspace-help" id="workspaceHelp" title="通知与帮助" aria-label="通知与帮助"></button>
        </div>
      </header>
      <div class="launch-progress-global" id="launchProgress" role="status" aria-live="polite" style="display:none">
        <div class="launch-progress-kicker"><span class="launch-progress-pulse" aria-hidden="true"></span><span id="launchProgressPhase">正在启动</span></div>
        <div class="launch-progress-head"><strong id="launchProgressText">准备启动</strong><span id="launchProgressPct">0%</span></div>
        <div class="launch-progress-track" id="launchProgressTrack" role="progressbar" aria-label="游戏启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="launch-progress-fill" id="launchProgressFill"></div></div>
        <div class="launch-progress-instance" id="launchProgressInstance"></div>
      </div>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="task-dock" id="taskDock"></div>
  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-root" id="toastRoot"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
